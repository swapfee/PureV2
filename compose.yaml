# PureV2 — one coordinator container with in-process Bun child workers.
# MongoDB is Atlas (external). Redis is private, disposable live-state only.
#
# Health is published ONLY to the VPS loopback:
#   curl http://127.0.0.1:3000/readyz
# REST proxy (8081) is never published.

services:
  purev2:
    build:
      context: .
      dockerfile: Dockerfile
    image: purev2:local
    container_name: purev2
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    # Do not publish 8081 / REST proxy.
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:'+(process.env.HEALTH_PORT||'3000')+'/healthz'); if(!r.ok) process.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 1536m
    cpus: 1.50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: /tmp
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:?set DISCORD_APPLICATION_ID in .env}
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-3}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-10000}
      MONGODB_WAIT_QUEUE_TIMEOUT_MS: ${MONGODB_WAIT_QUEUE_TIMEOUT_MS:-5000}
      BOT_WORKER_COUNT: ${BOT_WORKER_COUNT:-1}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-5000}
      WORKER_HEARTBEAT_TIMEOUT_MS: ${WORKER_HEARTBEAT_TIMEOUT_MS:-15000}
      WORKER_RESTART_BASE_DELAY_MS: ${WORKER_RESTART_BASE_DELAY_MS:-1000}
      WORKER_RESTART_MAX_DELAY_MS: ${WORKER_RESTART_MAX_DELAY_MS:-30000}
      WORKER_EVENT_ACK_TIMEOUT_MS: ${WORKER_EVENT_ACK_TIMEOUT_MS:-30000}
      WORKER_EVENT_BUFFER_LIMIT: ${WORKER_EVENT_BUFFER_LIMIT:-1000}
      WORKER_EVENT_MAX_ATTEMPTS: ${WORKER_EVENT_MAX_ATTEMPTS:-3}
      WORKER_EVENT_DEDUP_LIMIT: ${WORKER_EVENT_DEDUP_LIMIT:-5000}
      WORKER_EVENT_DEDUP_TTL_MS: ${WORKER_EVENT_DEDUP_TTL_MS:-300000}
      HEALTH_HOST: ${HEALTH_HOST:-0.0.0.0}
      HEALTH_PORT: ${HEALTH_PORT:-3000}
      REST_PROXY_HOST: ${REST_PROXY_HOST:-127.0.0.1}
      REST_PROXY_PORT: ${REST_PROXY_PORT:-8081}
      REST_PROXY_AUTHORIZATION: ${REST_PROXY_AUTHORIZATION:?set REST_PROXY_AUTHORIZATION in .env}
      REST_PROXY_BODY_LIMIT_BYTES: ${REST_PROXY_BODY_LIMIT_BYTES:-1048576}
      REST_REQUEST_CACHE_LIMIT: ${REST_REQUEST_CACHE_LIMIT:-5000}
      REST_REQUEST_CACHE_TTL_MS: ${REST_REQUEST_CACHE_TTL_MS:-300000}
      DASHBOARD_API_HOST: ${DASHBOARD_API_HOST:-0.0.0.0}
      DASHBOARD_API_PORT: ${DASHBOARD_API_PORT:-8082}
      DASHBOARD_API_AUTHORIZATION: ${DASHBOARD_API_AUTHORIZATION:?set DASHBOARD_API_AUTHORIZATION in .env}
      DASHBOARD_API_BODY_LIMIT_BYTES: ${DASHBOARD_API_BODY_LIMIT_BYTES:-32768}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      VOICE_STATS_CHECKPOINT_INTERVAL_MS: ${VOICE_STATS_CHECKPOINT_INTERVAL_MS:-300000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-30000}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No privileged mode, no Docker socket mount, no extra capabilities.

  dashboard:
    build:
      context: ./dark-landing-page-design
      dockerfile: Dockerfile
    image: purev2-dashboard:local
    container_name: purev2-dashboard
    restart: unless-stopped
    init: true
    depends_on:
      purev2:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      NODE_ENV: production
      PORT: 3100
      HOSTNAME: 0.0.0.0
      PUREV2_CONTROL_API_URL: http://purev2:8082
      PUREV2_CONTROL_API_AUTHORIZATION: ${DASHBOARD_API_AUTHORIZATION:?set DASHBOARD_API_AUTHORIZATION in .env}
      PUREV2_DASHBOARD_GUILD_ID: ${PUREV2_DASHBOARD_GUILD_ID:-1539918723396407357}
      DISCORD_CLIENT_ID: ${DISCORD_APPLICATION_ID:?set DISCORD_APPLICATION_ID in .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET in .env}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:?set DISCORD_OAUTH_REDIRECT_URI in .env}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:?set DASHBOARD_SESSION_SECRET in .env}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3100/'); if(!r.ok) process.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:7.4.5-alpine
    user: redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--dir", "/tmp", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    # Intentionally no ports: Redis is reachable only on the private Compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 160m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
